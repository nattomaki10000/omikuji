<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おみくじ</title>
    <style>
      body { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a1a; }
      canvas { display: block; width: 100vw; height: 100vh; }

      #drawButton {
        position: fixed;
        right: 20px;
        bottom: 20px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 4px solid transparent;
        background-image: linear-gradient(#ff0000, #ff0000), linear-gradient(to right, #ff7e5f, #feb47b);
        background-origin: border-box;
        background-clip: padding-box, border-box;
        cursor: pointer;
        z-index: 5;
      }
      #drawButton:hover:not(:disabled) { filter: brightness(0.8); }
      #drawButton:disabled { opacity: 0.5; cursor: default; }

      #paper {
        position: fixed;
        left: 50%;
        top: 8vh;
        transform: translate(-50%, -160vh);
        width: min(360px, 88vw);
        max-height: 84vh;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 24px 22px;
        background: #fff8e7;
        color: #7a1f1f;
        border: 3px solid #c0392b;
        border-radius: 6px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        font-family: "Hiragino Mincho ProN","Yu Mincho",serif;
        transition: transform 1.1s cubic-bezier(0.2,0.8,0.2,1);
        z-index: 10;
      }
      #paper.show { transform: translate(-50%, 0); }
      #paper h2 { margin: 0 0 8px; text-align: center; font-size: 1.6em; letter-spacing: .2em; }
      #paper .num { text-align: center; margin: 0 0 4px; font-size: .9em; color: #555; }
      #paper .fortune { text-align: center; font-size: 2em; font-weight: bold; margin: 8px 0 16px; }
      #paper dl { margin: 0; }
      #paper dt { font-weight: bold; margin-top: 10px; }
      #paper dd { margin: 2px 0 0 0; line-height: 1.5; }
      #closeBtn {
        display: block; margin: 18px auto 0; padding: 8px 24px;
        border: none; border-radius: 20px; background: #c0392b;
        color: #fff; font-size: 1em; cursor: pointer;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <button id="drawButton" disabled>ひく</button>
    <div id="paper" aria-live="polite">
      <h2>おみくじ</h2>
      <p class="num" id="resNum"></p>
      <p class="fortune" id="resFortune"></p>
      <dl id="resDetails"></dl>
      <button id="closeBtn">閉じる</button>
    </div>

    <script type="module">
            import * as THREE from 'three';
            import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
            import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe6e6e6);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(6, 3, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.minDistance = 0.2;
            controls.maxDistance = 15;

            scene.add(new THREE.AmbientLight(0xffffff, 2));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            const FRONT_DIR = new THREE.Vector3(
              Math.cos(THREE.MathUtils.degToRad(30)),
              -Math.sin(THREE.MathUtils.degToRad(30)),
              0
            ).normalize();

            // 5倍拡大（距離1）からさらに0.5に
            const ZOOM_DISTANCE = 0.5;

            const drawButton = document.getElementById('drawButton');
            const paper      = document.getElementById('paper');
            const resNum     = document.getElementById('resNum');
            const resFortune = document.getElementById('resFortune');
            const resDetails = document.getElementById('resDetails');
            const closeBtn   = document.getElementById('closeBtn');

            let model = null, stick = null, label = null, busy = false;
            const initial = {
              camPos: camera.position.clone(),
              target: new THREE.Vector3(0,0,0),
              center: new THREE.Vector3(0,0,0),
              rotZ: 0,
              stickPos: null
            };

            const loader = new GLTFLoader();
            loader.load('おみくじ.glb',
              (gltf) => {
                model = gltf.scene;
                scene.add(model);
                model.updateMatrixWorld(true);
                initial.center.copy(new THREE.Box3().setFromObject(model).getCenter(new THREE.Vector3()));
                stick = findStick(model);
                initial.rotZ = model.rotation.z;
                if (stick) initial.stickPos = stick.position.clone();
                drawButton.disabled = false;
              },
              undefined,
              (err) => { console.error(err); drawButton.disabled = false; }
            );

            function findStick(root) {
              let found = null;
              root.traverse((o) => {
                if (!found && o.isMesh && /stick|棒|bar|くじ/i.test(o.name)) found = o;
              });
              if (found) return found;
              let best = null, bestRatio = 0;
              root.traverse((o) => {
                if (!o.isMesh) return;
                const s = new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3());
                const d = [s.x, s.y, s.z].sort((a,b) => a-b);
                const r = d[2] / Math.max(d[0], 1e-6);
                if (r > bestRatio) { bestRatio = r; best = o; }
              });
              return bestRatio > 4 ? best : null;
            }

      function createLabel(number, stickMesh) {
        const geo = stickMesh.geometry;
        geo.computeBoundingBox();
        const bb     = geo.boundingBox;
        const size   = bb.getSize(new THREE.Vector3());
        const center = bb.getCenter(new THREE.Vector3());
        const dims   = [size.x, size.y, size.z];
        const axes   = [new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1)];

        const longIdx   = dims.indexOf(Math.max(...dims));
        const L         = axes[longIdx].clone();
        const shortIdxs = [0,1,2].filter(i => i !== longIdx);

        // カメラ側の方向（N）
        const camLocal = stickMesh.worldToLocal(camera.position.clone()).sub(center);
        const nIdx = shortIdxs.reduce((a,b) =>
          Math.abs(camLocal.getComponent(a)) >= Math.abs(camLocal.getComponent(b)) ? a : b
        );
        const sign = camLocal.getComponent(nIdx) >= 0 ? 1 : -1;
        const N    = axes[nIdx].clone().multiplyScalar(sign);
        const wIdx = shortIdxs.find(i => i !== nIdx);
        const X    = new THREE.Vector3().crossVectors(L, N).normalize();

        // 実際の表面の半径（軸からの最大距離）を頂点から求める
        const pos = geo.attributes.position;
        const v = new THREE.Vector3();
        let radius = 0;
        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i).sub(center);
          const perp = v.clone().addScaledVector(L, -v.dot(L)).length();
          if (perp > radius) radius = perp;
        }
        const rr = radius + 0.002; // 表面からごくわずかだけ浮かせる

        // ラベルの寸法
        const planeH   = dims[wIdx] * 1.1;
        const digits   = String(number).length;
        const planeLen = Math.min(dims[longIdx] * 0.9, planeH * (digits * 0.9 + 0.4));
        const arc      = Math.min(planeH / rr, Math.PI * 0.9);

        // 本体（モデル中心）から遠い側の端
        const bodyCenterWorld = new THREE.Box3().setFromObject(model).getCenter(new THREE.Vector3());
        const bodyLocal = stickMesh.worldToLocal(bodyCenterWorld.clone()).sub(center);
        const farSign   = bodyLocal.dot(L) > 0 ? -1 : 1;
        const alongCenter = farSign * (dims[longIdx] / 2 - planeLen / 2 - 0.01);

        // テクスチャ：背景は透明、数字を左に90°回転して描画
        const cw = 512;
        const ch = Math.max(64, Math.round(cw * (planeH / planeLen)));
        const canvas = document.createElement('canvas');
        canvas.width = cw;
        canvas.height = ch;
        const g = canvas.getContext('2d');
        g.clearRect(0, 0, cw, ch);
        g.fillStyle = '#ffffff';
        g.textAlign = 'center';
        g.textBaseline = 'middle';

        const text = String(number);
        let fontPx = ch * 0.8;
        g.font = `bold ${Math.round(fontPx)}px serif`;
        const measured = g.measureText(text).width;
        if (measured > ch * 0.9) {
          fontPx = fontPx * (ch * 0.9) / measured;
          g.font = `bold ${Math.round(fontPx)}px serif`;
        }
        g.save();
        g.translate(cw / 2, ch / 2);
        g.rotate(Math.PI / 2);
        g.fillText(text, 0, 0);
        g.restore();

        const texture  = new THREE.CanvasTexture(canvas);
        const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true, depthWrite: false });

        // 筒の表面に沿う曲面を頂点から直接作成
        const S = 32;
        const positions = [];
        const uvs = [];
        const indices = [];
        const p = new THREE.Vector3();
        const dir = new THREE.Vector3();

        for (let i = 0; i <= S; i++) {
          const theta = -arc / 2 + arc * (i / S);
          dir.copy(N).multiplyScalar(Math.cos(theta)).addScaledVector(X, Math.sin(theta));
          for (let j = 0; j <= 1; j++) {
            const t = -planeLen / 2 + planeLen * j;
            p.copy(center)
              .addScaledVector(L, alongCenter + t)
              .addScaledVector(dir, rr);
            positions.push(p.x, p.y, p.z);
            uvs.push(1 - j, i / S); // 左右反転を解消するためUのみ反転
          }
        }
        for (let i = 0; i < S; i++) {
          const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
          indices.push(a, c, b, b, c, d);
        }

        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geom.setIndex(indices);

        const mesh = new THREE.Mesh(geom, material);
        stickMesh.add(mesh);
        return mesh;
      }

            function tween(duration, onUpdate) {
              return new Promise((resolve) => {
                const start = performance.now();
                function step(now) {
                  const t = Math.min((now - start) / duration, 1);
                  const e = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
                  onUpdate(e);
                  if (t < 1) requestAnimationFrame(step); else resolve();
                }
                requestAnimationFrame(step);
              });
            }
            const wait = (ms) => new Promise(r => setTimeout(r, ms));

            async function drawOmikuji() {
              if (busy) return;
              busy = true;
              drawButton.disabled = true;
              controls.enabled = false;

              const number = Math.floor(Math.random() * 100) + 1;
              const result = generateOmikuji(number);

              // 0. 正面・30°下の視点へ
              {
                const pStart = camera.position.clone();
                const tStart = controls.target.clone();
                const pEnd   = initial.center.clone().addScaledVector(FRONT_DIR, 8);
                await tween(800, (e) => {
                  camera.position.lerpVectors(pStart, pEnd, e);
                  controls.target.lerpVectors(tStart, initial.center, e);
                });
                await wait(200);
              }

              // 1. モデルを逆さまに
              if (model) {
                const startRot = initial.rotZ;
                await tween(1000, (e) => { model.rotation.z = startRot + Math.PI * e; });
                await wait(300);
              }

              // 2. stickに番号を書く
              if (stick) label = createLabel(number, stick);

              // 3. stickを2下に移動
              let focus;
              if (stick) {
                const startLocal  = stick.position.clone();
                const worldPos    = stick.getWorldPosition(new THREE.Vector3());
                const targetWorld = worldPos.clone().add(new THREE.Vector3(0, -2, 0));
                const endLocal    = stick.parent.worldToLocal(targetWorld.clone());
                await tween(1200, (e) => { stick.position.lerpVectors(startLocal, endLocal, e); });
                await wait(200);

                // ラベル（stick先端）より1.5下をズーム中心にして数字が見えやすくする
                focus = stick.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, -1.5, 0));
              } else {
                focus = initial.center.clone();
              }

              // 4. ズームアップ（FRONT_DIR方向から距離0.5）
              const camStart   = camera.position.clone();
              const targetStart = controls.target.clone();
              const zoomPos    = focus.clone().addScaledVector(FRONT_DIR, ZOOM_DISTANCE);
              await tween(1200, (e) => {
                camera.position.lerpVectors(camStart, zoomPos, e);
                controls.target.lerpVectors(targetStart, focus, e);
              });
              await wait(300);

              // 5. 結果の紙をスライドイン
              resNum.textContent     = `${result.番号}番 ・ ${result.運勢}`;
              resFortune.textContent = result.運勢;
              resDetails.innerHTML   = Object.entries(result.詳細)
                .map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
              paper.classList.add('show');
            }

            function resetScene() {
              paper.classList.remove('show');
              if (model) model.rotation.z = initial.rotZ;
              if (stick && initial.stickPos) stick.position.copy(initial.stickPos);
              if (label) {
                label.parent.remove(label);
                label.geometry.dispose();
                label.material.map.dispose();
                label.material.dispose();
                label = null;
              }
              camera.position.copy(initial.camPos);
              controls.target.copy(initial.target);
              controls.enabled = true;
              busy = false;
              drawButton.disabled = false;
            }

            drawButton.addEventListener('click', drawOmikuji);
            closeBtn.addEventListener('click', resetScene);

            function animate() {
              requestAnimationFrame(animate);
              controls.update();
              renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
              camera.aspect = window.innerWidth / window.innerHeight;
              camera.updateProjectionMatrix();
              renderer.setSize(window.innerWidth, window.innerHeight);
            });
    </script>

    <script>
      const omikujiItems = {
        願事: ["全く叶う気配がない。今は目標を見直すべき。","障害が多くて進まない。焦るとさらに悪化する。","努力を続ければ、少しずつ形になっていく。","思った以上のスピードで、すんなり叶う。","願う前に向こうからチャンスがやってくる。大成功する。"],
        待人: ["来ない。むしろあなたをトラブルに巻き込む人が現れる。","遅れる。期待しすぎると裏切られて落ち込む。","遅れてやってくる。連絡をこまめに取ると吉。","まもなく現れる。あなたの人生を良い方向に変える人。","すでに身近にいる。その人が最高のキーパーソンになる。"],
        失物: ["見つからない。あきらめて買い直した方が早い。","出てくるのが遅い。すっかり忘れた頃に見つかる。","高いところ、または身近な隙間を探すと見つかる。","すぐに見つかる。身近な人が見つけてくれる。","なくした物以上の価値がある代替品や、良いものが見つかる。"],
        旅行: ["行くな。トラブルや体調不良に巻き込まれるリスク大。","計画通りに進まない。忘れ物や遅延に要注意。","事前準備を徹底すれば、楽しく過ごせる。","最高の旅になる。特に東（または吉方位）への遠出が良い。","人生の価値観が変わるような、素晴らしい出会いや発見がある。"],
        商売: ["大赤字の危機。新しい投資や仕入れは絶対にNG。","利益が出にくい。地道に現状維持を心がけるべき。","損はない。少しずつだけど確実に売上が伸びる。","買えば儲かる。新しいプロジェクトを始める好機。","莫大な利益が出る。ビジネスパートナーにも恵まれる。"],
        学問: ["実力が出せない。勉強方法が根本的に間違っている。","油断大敵。基礎がおろそかになっているので見直しを。","努力した分だけ成果が出る。油断しなければ合格圏内。","安心して良い。試験で実力以上の力を発揮できる。","満点近い成績で合格する。周囲からも一目置かれる。"],
        相場: ["今すぐ手を引け。大損して取り返しのつかないことになる。","焦って売買すると損をする。今は様子見が正解。","欲を張らなければ、小さく利益を出せる。","今が買い時・売り時。思い切って動くと吉。","大化けする。最高のタイミングで最高の利益を得られる。"],
        争事: ["完全に負ける。非を認めて早めに謝罪した方が傷が浅い。","長引いて精神的に消耗する。勝ち目は薄い。","話し合えば和解できる。勝ちにこだわらないこと。","勝つ。あなたの主張が全面的に通る。","戦わずして勝つ。相手が自滅するか、味方になる。"],
        恋愛: ["騙される危険あり。今の相手やアプローチは一度リセットすべき。","空回りしやすい。自分の気持ちを押し付けすぎないように。","誠実に対応すれば、少しずつ距離が縮まる。縁談も進む。","理想の相手と結ばれる。告白やプロポーズに最適な時期。","運命の糸で結ばれている。周囲から祝福されてスピード婚へ。"],
        転居: ["やめよ。引っ越し先でトラブルや体調不良が続く恐れ。","条件が良くない。物件探しを妥協すると後悔する。","急がなければ良い場所が見つかる。リフォームも吉。","素晴らしい物件に出会える。生活の質が大きく向上する。","その土地・家に入居することで、全体の運気が爆発的に上がる。"],
        病気: ["長引く。自己判断せず、すぐに専門医の診察を受けること。","回復が遅い。無理をすると再発する。しっかり休養を。","医師の指示に従えば、順調に回復へと向かう。","すみやかに治る。健康な体をキープできる。","病気が完全に消え去り、前以上の活力と健康を手に入れる。"]
      };

      function generateOmikuji(number) {
        if (number < 1 || number > 100) return "1から100の数値を指定してください。";
        let unsei = "", allowedLevels = [];
        if      (number <= 17) { unsei = "大吉";   allowedLevels = [3,4]; }
        else if (number <= 52) { unsei = "吉";     allowedLevels = [2,3]; }
        else if (number <= 58) { unsei = "末吉";   allowedLevels = [1,2,3]; }
        else if (number <= 63) { unsei = "半吉";   allowedLevels = [1,2]; }
        else if (number <= 67) { unsei = "小吉";   allowedLevels = [1,2,3]; }
        else if (number <= 70) { unsei = "末小吉"; allowedLevels = [1,2]; }
        else                   { unsei = "凶";     allowedLevels = [0,1]; }
        const result = { 番号: number, 運勢: unsei, 詳細: {} };
        Object.keys(omikujiItems).forEach((name, i) => {
          result.詳細[name] = omikujiItems[name][allowedLevels[(number+i) % allowedLevels.length]];
        });
        return result;
      }
    </script>
  </body>
</html>
